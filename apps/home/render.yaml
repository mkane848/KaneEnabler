# NOTE: this is the platform's shared landing page — see root render.yaml
# for how it fits alongside the two tools it links to. Its "render.yaml
# path" setting in the dashboard needs to point at apps/home/render.yaml.
services:
  # No rootDir: Render's static-site builds run an automatic
  # dependency-install step ahead of buildCommand, scoped to rootDir if set.
  # That step detects the package manager by looking for a lockfile in that
  # directory — since this is a single-root-lockfile pnpm workspace (no
  # per-app pnpm-lock.yaml), a rootDir-scoped static site finds none and
  # silently falls back to npm, which then can't resolve workspace:* deps.
  # Keeping rootDir unset makes that auto-install step scan the repo root
  # instead, where pnpm-lock.yaml actually lives — cd into the app dir
  # ourselves instead. (See render.yaml at the repo root and
  # apps/commander-recommender/render.yaml for the same pattern.)
  - type: web
    runtime: static
    name: kaneenabler-home
    buildCommand: cd apps/home && pnpm install --frozen-lockfile && pnpm run build
    staticPublishPath: apps/home/dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
